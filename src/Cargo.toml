[workspace]
resolver = "2"
members = ["fastglob"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Moe Shawky <moe@libermoe.com>"]
description = "A single-pass, byte-exact pathname-globbing engine for Linux, compatibility-locked to the installed Python stdlib glob."
repository = "https://github.com/moeshawky/fastglob"
# Workspace-root-relative: inherited paths re-express package-relative, so
# this points at the repo-root README (one level above the workspace root).
readme = "../README.md"
keywords = ["glob", "fnmatch", "path", "filesystem", "python"]
categories = ["filesystem"]

[workspace.dependencies]
libc = "0.2"

[workspace.lints.rust]
# unsafe_code cannot be denied: the engine is a libc-FFI port of CPython's
# glob (openat/fstatat/fdopendir) — every unsafe block carries a SAFETY comment.
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
