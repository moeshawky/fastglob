name: ci
on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
      - name: Install Python (pinned to the oracle version)
        uses: actions/setup-python@v5
        with:
          # The compat freshness gate (tests/compat/compare.py, C15) requires
          # the RUNNING interpreter to equal the capture's interpreter exactly
          # (`_meta.python`). The committed capture records **3.12.3** — see
          # tests/oracle/capture.json `_meta`. This pin therefore MUST be
          # 3.12.3: pinning any OTHER 3.12.x made the gate raise and the compat
          # job fail by construction. If the oracle is ever re-captured on a
          # different interpreter, change this pin in the SAME commit.
          python-version: "3.12.3"
      - name: Format check
        run: cargo fmt --check --manifest-path src/Cargo.toml
      - name: Clippy (deny warnings, all targets)
        # --all-features compiles the pyo3 extension module (fastglob._core)
        # so the in-process bindings carry the same lint gate as the engine.
        run: cargo clippy --workspace --all-targets --all-features --manifest-path src/Cargo.toml -- -D warnings
      - name: Build
        run: make build
      - name: Unit tests
        run: cargo test --all-features --manifest-path src/Cargo.toml
        # cargo-nextest is not preinstalled on ubuntu-latest; cargo test keeps
        # the gate hermetic. Swap to `cargo nextest run` once installed.
      - name: Docs (deny warnings)
        run: cargo doc --workspace --no-deps --manifest-path src/Cargo.toml
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: cargo deny (when available)
        run: |
          if command -v cargo-deny >/dev/null 2>&1; then
            (cd src && cargo deny check)
          else
            echo "cargo-deny not on runner PATH; G5 deferred (deny.toml committed at src/deny.toml)"
          fi
      - name: Oracle capture (uid-consistent for this runner)
        run: make oracle-capture
        # The committed oracle capture was recorded as uid 1001 (non-root) on
        # Python 3.12.3 — see tests/oracle/capture.json `_meta`. The fixture's
        # 000-mode errors/unreadable directory (§8.6) is readable to root but
        # not to a non-root runner, so the manifest stamp and the
        # unreadable-dir results are uid-dependent by design (no error policy
        # is fabricated — docs/compatibility-contract.md §8.6). Re-capturing
        # the oracle under the SAME user that runs the engine keeps the
        # differential uid-consistent (VERIFIED uid 1001: 139/139).
      - name: Compat suite (139 cases, multiset)
        run: make compat
      - name: Self-test oracle
        run: python3 tests/compat/compare.py --self-test
      - name: Matcher differential vs stdlib fnmatch
        # Committed, reproducible replacement for the old "400k differential via
        # out/dev/diff_match.py" claim — out/ is gitignored and that file is
        # absent, so the citation could not be re-executed. Also pins the one
        # declared bytes-mode divergence (docs/compatibility-contract.md §8.10).
        run: python3 tests/test_match_bytes_oracle.py
      - name: Fused vs recursive differential (+ FASTGLOB_NO_FUSED bypass)
        # Fused fast path vs the verbatim CPython port on a purpose-built tree,
        # driving the CLI in separate subprocesses because the bypass latches
        # once per process. Also proves the bypass is wired via the
        # symlink-cycle discriminator. Any non-cycle divergence = fused-path
        # regression; cycle depth divergence is declared Level C (§8.5a).
        run: python3 tests/test_fused_differential.py
      - name: Deploy driver (syntax + rollback guards)
        # tools/deploy.sh is the only shipped shell script, and its rollback path
        # is the only code in this repo that can delete an installed package. It
        # was gated NOWHERE: a syntax error or a lost authority guard would
        # surface on the day an operator deploys. Same gate as `make test`.
        run: |
          bash -n tools/deploy.sh
          python3 tests/test_deploy_guard.py
      - name: Shim suite (routing observability + namespace parity)
        # F-009: tests/test_shim_loud.py and tests/test_shim_parity.py were
        # gated NOWHERE in CI — `make test` ran them locally, CI never did, so
        # the shim's documented deploy surface could break without a red
        # build. `make shim-test` is the same gate the Makefile uses.
        run: make shim-test

  # Python package quality gate (python-standards G1-G6) for python/.
  # Single leg pinned to the oracle interpreter, same justification as the
  # compat job: the 3.8-3.9 syntax floor is enforced by ruff's target-version
  # py38 (FA102 flags PEP 585/604 missing the future import — measured),
  # and mypy 2.x clamps targets below 3.10. A zero-dependency stdlib-only
  # package earns floor evidence from tool targets, not interpreter legs.
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
      - name: Install Python (pinned to the oracle version)
        uses: actions/setup-python@v5
        with:
          # Must equal tests/oracle/capture.json `_meta.python` (3.12.3) — the
          # compat freshness gate compares the running interpreter exactly.
          python-version: "3.12.3"
      - name: Build engine
        run: make build
      - name: Install dev stack (editable, quality extras) + uv
        run: pip install -e "python[dev]" uv
      - name: Ruff lint (G1)
        run: ruff check python/
      - name: Ruff format check (G2)
        run: ruff format --check python/
      - name: Type check, mypy strict (G3)
        run: cd python && mypy fastglob
      - name: Tests + coverage (G4/G5)
        run: cd python && python -m pytest ../tests/test_package.py --cov=fastglob --cov-report=term-missing
      - name: Lockfile check (G6)
        run: cd python && uv lock --check
